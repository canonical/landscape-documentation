                    type: boolean
                    description: |-
                        Setting this field to `true` will opt the request into returning the
                         locals that are reachable, and into including the names of those that
                         were unreachable in the [BatchGetLocalsResponse.unreachable] field.
            description: The request message for retrieving a batch of local repositories.
        BatchGetLocalsResponse:
            type: object
            properties:
                locals:
                    type: array
                    items:
                        $ref: '#/components/schemas/Local'
                    description: Local repositories requested.
                unreachable:
                    type: array
                    items:
                        type: string
                    description: |-
                        Unreachable locals. Populated when the request opts into
                         `return_partial_success` and reading across collections.
            description: The response message for retrieving a batch of local repositories.
        BatchGetMirrorsRequest:
            required:
                - names
            type: object
            properties:
                names:
                    type: array
                    items:
                        type: string
                    description: |-
                        The names of the mirrors to retrieve.
                         A maximum of 100 mirrors can be retrieved in a batch.
                         Format: mirrors/{mirror}
                returnPartialSuccess:
                    type: boolean
                    description: |-
                        Setting this field to `true` will opt the request into returning the
                         mirrors that are reachable, and into including the names of those that
                         were unreachable in the [BatchGetMirrorsResponse.unreachable] field.
            description: The request message for retrieving a batch of mirrors.
        BatchGetMirrorsResponse:
            type: object
            properties:
                mirrors:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mirror'
                    description: Mirrors requested.
                unreachable:
                    type: array
                    items:
                        type: string
                    description: |-
                        Unreachable mirrors. Populated when the request opts into
                         `return_partial_success` and reading across collections.
            description: The response message for retrieving a batch of mirrors.
        BatchGetOperationsRequest:
            required:
                - names
            type: object
            properties:
                names:
                    type: array
                    items:
                        type: string
                    description: |-
                        The names of the long-running operations to retrieve.
                         A maximum of 100 long-running operations can be retrieved in a batch.
                         Format: operations/{operation}
                returnPartialSuccess:
                    type: boolean
                    description: |-
                        Setting this field to `true` will opt the request into returning the
                         operations that are reachable, and into including the names of those that
                         were unreachable in the [BatchGetOperationsResponse.unreachable] field.
            description: The request message for retrieving a batch of long-running operations.
        BatchGetOperationsResponse:
            type: object
            properties:
                operations:
                    type: array
                    items:
                        $ref: '#/components/schemas/Operation'
                    description: Long-running operations requested.
                unreachable:
                    type: array
                    items:
                        type: string
                    description: |-
                        Unreachable operations. Populated when the request opts into
                         `return_partial_success` and reading across collections.
            description: The response message for retrieving a batch of long-running operations.
        BatchGetPublicationTargetsRequest:
            required:
                - names
            type: object
            properties:
                names:
                    type: array
                    items:
                        type: string
                    description: |-
                        The names of the publication targets to retrieve.
                         A maximum of 100 publication targets can be retrieved in a batch.
                         Format: publicationTargets/{publication_target}
                returnPartialSuccess:
                    type: boolean
                    description: |-
                        Setting this field to `true` will opt the request into returning the
                         publication targets that are reachable, and into including the names of
                         those that were unreachable in the
                         [BatchGetPublicationTargetsResponse.unreachable] field.
            description: The request message for retrieving a batch of publication targets.
        BatchGetPublicationTargetsResponse:
            type: object
            properties:
                publicationTargets:
                    type: array
                    items:
                        $ref: '#/components/schemas/PublicationTarget'
                    description: Publication targets requested.
                unreachable:
                    type: array
                    items:
                        type: string
                    description: |-
                        Unreachable publication targets. Populated when the request opts into
                         `return_partial_success` and reading across collections.
            description: The response message for retrieving a batch of publication targets.
        FilesystemTarget:
            required:
                - path
            type: object
            properties:
                path:
                    type: string
                    description: |-
                        The path to the directory where files should be published.
                         This is relative to the server's configured `FILESYSTEM_PUBLISHED_ROOT`.
                linkMethod:
                    enum:
                        - HARDLINK
                        - SYMLINK
                        - COPY
                    type: string
                    description: The link method to use for published files. Defaults to `HARDLINK`.
                    format: enum
            description: A local filesystem storage destination.
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        GpgKey:
            required:
                - armor
            type: object
            properties:
                armor:
                    writeOnly: true
                    type: string
                    description: The GPG key in ASCII armor format.
                isPrivate:
                    readOnly: true
                    type: boolean
                    description: Indicates if the key holds a private component.
                fingerprint:
                    readOnly: true
                    type: string
                    description: The fingerprint of the key.
            description: A GPG key resource.
        ImportLocalPackagesRequest:
            required:
                - name
                - url
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the local repository to import packages into.
                         Format: "locals/{local}"
                url:
                    type: string
                    description: The URL of the package list or index to import from.
                validateOnly:
                    type: boolean
                    description: |-
                        If set to true, the request is validated without actually performing the import.
                         The set of packages that would be imported is returned as the result of the task.
                         See: https://google.aip.dev/163
            description: The request message for importing packages into a local repository.
        ListLocalPackagesResponse:
            type: object
            properties:
                localPackages:
                    type: array
                    items:
                        type: string
                    description: |-
                        The list of package name strings.
                         Example: ["snap-http_1.4.0_source", ...]
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
            description: The response message for listing local repository packages.
        ListLocalsResponse:
            type: object
            properties:
                locals:
                    type: array
                    items:
                        $ref: '#/components/schemas/Local'
                    description: The list of local repositories.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
            description: The response message for listing local repositories.
        ListMirrorPackagesResponse:
            type: object
            properties:
                mirrorPackages:
                    type: array
                    items:
                        type: string
                    description: |-
                        The list of package strings.
                         Example: ["snap-http_1.4.0_source", ...]
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
            description: The response message for listing packages in a mirror.
        ListMirrorsResponse:
            type: object
            properties:
                mirrors:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mirror'
                    description: The list of mirrors.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
            description: The response message for listing mirrors.
        ListPublicationTargetsResponse:
            type: object
            properties:
                publicationTargets:
                    type: array
                    items:
                        $ref: '#/components/schemas/PublicationTarget'
                    description: The publication targets.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
            description: The response message for listing publication targets.
        ListPublicationsResponse:
            type: object
            properties:
                publications:
                    type: array
                    items:
                        $ref: '#/components/schemas/Publication'
                    description: A list of publications.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
            description: The response message for listing publications.
        Local:
            required:
                - displayName
                - defaultDistribution
                - defaultComponent
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the local repository.
                         Format: "locals/{local}"
                localId:
                    readOnly: true
                    type: string
                    description: The local repository ID is exposed separately for convenience.
                displayName:
                    type: string
                    description: The human-readable name used to reference this local repository.
                comment:
                    type: string
                    description: A user-facing description of the local repository.
                defaultDistribution:
                    type: string
                    description: The default distribution to publish.
                defaultComponent:
                    type: string
                    description: The default component to publish.
                lastOperation:
                    readOnly: true
                    type: string
                    description: The last associated LRO with the local
                lastImportTime:
                    readOnly: true
                    type: string
                    description: The timestamp of the last successful package import.
                    format: date-time
            description: Represents a local repository.
        Mirror:
            required:
                - displayName
                - archiveRoot
                - distribution
                - architectures
                - components
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the mirror.
                         Format: "mirrors/{mirror}"
                mirrorId:
                    readOnly: true
                    type: string
                    description: The mirror ID is exposed separately for convenience.
                status:
                    readOnly: true
                    type: string
                    description: The status of the mirror.
                lastDownloadDate:
                    readOnly: true
                    type: string
                    description: The timestamp of the last successful download.
                    format: date-time
                displayName:
                    type: string
                    description: The human-readable name used to reference this mirror.
                archiveRoot:
                    type: string
                    description: |-
                        Root of the debian archive (URL).
                         When creating mirrors for repositories that require authentication (such as ESM repos), you
                         can include authentication tokens directly in the URL using the HTTP Basic Authentication
                         format, e.g.:

                         https://bearer:<my-esm-token>@esm.ubuntu.com/infra/ubuntu/

                         Credentials in the URL are securely handled and scrubbed from API responses for security
                         purposes.
                distribution:
                    type: string
                    description: The name of the distribution (subdirectory of `dists`).
                architectures:
                    type: array
                    items:
                        type: string
                    description: List of architectures to fetch.
                components:
                    type: array
                    items:
                        type: string
                    description: List of components to fetch.
                downloadInstaller:
                    type: boolean
                    description: Indicates if installer files should be downloaded.
                downloadSources:
                    type: boolean
                    description: Indicates if sources files should be downloaded.
                downloadUdebs:
                    type: boolean
                    description: Indicates if `.udebs` files should be downloaded.
                filter:
                    type: string
                    description: |-
                        Package query applied to the mirror.
                         Follows the [Reprepro/Aptly language](https://www.aptly.info/doc/feature/query/).
                filterWithDeps:
                    type: boolean
                    description: Indicates if dependencies of matching packages should be included.
                skipArchitectureCheck:
                    type: boolean
                    description: Indicates if the architecture list verification should be skipped.
                skipComponentCheck:
                    type: boolean
                    description: Indicates if the component list verification should be skipped.
                preserveSignatures:
                    type: boolean
                    description: Indicates if the mirror is a signature-preserving mirror.
                gpgKey:
                    allOf:
                        - $ref: '#/components/schemas/GpgKey'
                    description: Optional GPG key to validate the upstream signature.
                lastOperation:
                    readOnly: true
                    type: string
                    description: The most recent long-running operation associated with the mirror.
                mirrorType:
                    enum:
                        - MIRROR_TYPE_UNSPECIFIED
                        - UBUNTU_ARCHIVE
                        - UBUNTU_SNAPSHOTS
                        - UBUNTU_PRO
                        - THIRD_PARTY
                    type: string
                    description: The type of upstream repository being mirrored.
                    format: enum
            description: A repository mirror configuration and status.
        Operation:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The server-assigned name, which is only unique within the same service that
                         originally returns it. If you use the default HTTP mapping, the
                         `name` should be a resource name ending with `operations/{unique_id}`.
                metadata:
                    allOf:
                        - $ref: '#/components/schemas/GoogleProtobufAny'
                    description: |-
                        Service-specific metadata associated with the operation.  It typically
                         contains progress information and common metadata such as create time.
                         Some services might not provide such metadata.  Any method that returns a
                         long-running operation should document the metadata type, if any.
                done:
                    type: boolean
                    description: |-
                        If the value is `false`, it means the operation is still in progress.
                         If `true`, the operation is completed, and either `error` or `response` is
                         available.
                error:
                    allOf:
                        - $ref: '#/components/schemas/Status'
                    description: The error result of the operation in case of failure or cancellation.
                response:
                    allOf:
                        - $ref: '#/components/schemas/GoogleProtobufAny'
                    description: |-
                        The normal, successful response of the operation.  If the original
                         method returns no data on success, such as `Delete`, the response is
                         `google.protobuf.Empty`.  If the original method is standard
                         `Get`/`Create`/`Update`, the response should be the resource.  For other
                         methods, the response should have the type `XxxResponse`, where `Xxx`
                         is the original method name.  For example, if the original method name
                         is `TakeSnapshot()`, the inferred response type is
                         `TakeSnapshotResponse`.
            description: |-
                This resource represents a long-running operation that is the result of a
                 network API call.
        Publication:
            required:
                - displayName
                - publicationTarget
                - source
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the publication.
                         Format: "publications/{uuid}"
                displayName:
                    type: string
                    description: The human-readable name used to reference this publication.
                publicationId:
                    readOnly: true
                    type: string
                    description: The publication ID (UUID) is exposed separately for convenience.
                publicationTarget:
                    type: string
                    description: |-
                        The resource name of the publication target.
                         Format: "publicationTargets/{publication_target}"
                source:
                    type: string
                    description: |-
                        The resource name of the source mirror or local repository.
                         Format: "mirrors/{mirror}" or "locals/{local}"
                distribution:
                    type: string
                    description: |-
                        The name of the distribution to publish.
                         Inferred from the source if omitted.
                label:
                    type: string
                    description: Value for the `Label:` field in the published repository's Release file.
                origin:
                    type: string
                    description: |-
                        Value for the `Origin:` field in the published repository's Release file.
                         Inferred from the source if omitted.
                architectures:
                    type: array
                    items:
                        type: string
                    description: |-
                        List of architectures to publish.
                         Defaults to all source architectures if omitted.
                acquireByHash:
                    type: boolean
                    description: Provides index files by hash in the published repository, if the files are unique.
                butAutomaticUpgrades:
                    type: boolean
                    description: 'Sets `ButAutomaticUpgrade: yes|no` in the published repository''s Release file if provided.'
                notAutomatic:
                    type: boolean
                    description: 'Sets `NotAutomatic: yes|no` in the published repository''s Release file if provided.'
                multiDist:
                    type: boolean
                    description: |-
                        Indicates if multiple distributions can be published to the same location, sharing a package
                         pool.
                skipBz2:
                    type: boolean
                    description: Indicates if bz2 compression should be skipped for index files.
                skipContents:
                    type: boolean
                    description: Indicates if content indexes should not be generated.
                gpgKey:
                    allOf:
                        - $ref: '#/components/schemas/GpgKey'
                    description: Optional GPG key to sign the release file(s). If not provided, the files will be unsigned.
                publishTime:
                    readOnly: true
                    type: string
                    description: The timestamp of the last successful publication.
                    format: date-time
                lastOperation:
                    readOnly: true
                    type: string
                    description: The name of the most recent long-running operation performed on the publication.
            description: |-
                The configuration for publishing Debian artifacts from a Source (mirror or local repository) to
                 a publication target.
        PublicationTarget:
            required:
                - displayName
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the publication target.
                         Format: "publicationTargets/{publication_target}"
                displayName:
                    type: string
                    description: The user-defined display name.
                publicationTargetId:
                    readOnly: true
                    type: string
                    description: The publication_id (uuid) is part of the `name`, and is exposed separately for convenience.
                s3:
                    allOf:
                        - $ref: '#/components/schemas/S3Target'
                    description: S3 storage.
                swift:
                    allOf:
                        - $ref: '#/components/schemas/SwiftTarget'
                    description: Swift storage.
                filesystem:
                    allOf:
                        - $ref: '#/components/schemas/FilesystemTarget'
                    description: Filesystem storage.
            description: Represents a publication storage destination (S3, Swift, or filesystem).
        PublishPublicationRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the publication to publish.
                         Format: "publications/{publication}"
                forceOverwrite:
                    type: boolean
                    description: Force overwrite of existing artifacts.
                forceCleanup:
                    type: boolean
                    description: Force cleanup of old artifacts.
            description: The request message for publishing a publication.
        S3Target:
            required:
                - region
                - bucket
                - awsAccessKeyId
                - awsSecretAccessKey
            type: object
            properties:
                region:
                    type: string
                    description: The AWS region for the S3 bucket. Possibly unused if using S3-compatible storage without regions.
                bucket:
                    type: string
                    description: The name of the target bucket.
                endpoint:
                    type: string
                    description: |-
                        Hostname used for S3-compatible storage.
                         If set, the region is ignored.
                awsAccessKeyId:
                    writeOnly: true
                    type: string
                    description: AWS-style access key ID for the bucket.
                awsSecretAccessKey:
                    writeOnly: true
                    type: string
                    description: AWS-style secret access key for the bucket.
                prefix:
                    type: string
                    description: |-
                        Path prefix under which artifacts will be published.
                         Defaults to the bucket root if not specified.
                acl:
                    type: string
                    description: ACL (Access Control List) used for published files.
                storageClass:
                    type: string
                    description: The AWS S3 storage class to use.
                encryptionMethod:
                    type: string
                    description: |-
                        Server-side encryption method. Defaults to none.
                         Currently, the only available encryption method is `AES256`.
                plusWorkaround:
                    type: boolean
                    description: Workaround for specific S3-compatible issues (e.g. "+" in filenames).
                disableMultiDel:
                    type: boolean
                    description: |-
                        Disables the `MultiDel` S3 API.
                         Useful for S3-compatible cloud storage providers that do not support it.
                forceSigV2:
                    type: boolean
                    description: |-
                        Disables Signature V4 support.
                         Useful for S3-compatible cloud storage providers that do not support SigV4.
                debug:
                    type: boolean
                    description: Enables debug logging for S3 operations.
            description: An S3 publication target destination.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        SwiftTarget:
            required:
                - container
                - username
                - password
                - authUrl
            type: object
            properties:
                container:
                    type: string
                    description: The name of the container.
                username:
                    writeOnly: true
                    type: string
                    description: OpenStack username for Keystone access.
                password:
                    writeOnly: true
                    type: string
                    description: OpenStack password for Keystone access.
                prefix:
                    type: string
                    description: |-
                        Path prefix under which artifacts will be published.
                         Defaults to the container root if not specified.
                authUrl:
                    type: string
                    description: The full URL of the Keystone server (including port and version).
                tenant:
                    type: string
                    description: The OpenStack tenant name.
                tenantId:
                    type: string
                    description: The OpenStack tenant ID.
                domain:
                    type: string
                    description: The OpenStack domain name.
                domainId:
                    type: string
                    description: The OpenStack domain ID.
                tenantDomain:
                    type: string
                    description: The OpenStack domain name the tenant/project belongs to.
                tenantDomainId:
                    type: string
                    description: The OpenStack domain ID the tenant/project belongs to.
            description: A Swift (OpenStack) storage destination.
        SyncMirrorRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the mirror to sync.
                         Format: "mirrors/{mirror}"
                keyrings:
                    type: array
                    items:
                        type: string
                    description: Optional keyring files to use for validation.
                ignoreChecksums:
                    type: boolean
                    description: Ignore checksum mismatches.
                ignoreSignatures:
                    type: boolean
                    description: Ignore signature verification failures.
                forceUpdate:
                    type: boolean
                    description: Force a full update.
                skipExistingPackages:
                    type: boolean
                    description: Skip downloading packages that already exist.
            description: The request message for syncing a mirror.
tags:
    - name: LocalService
      description: Manages local repositories.
    - name: MirrorService
      description: Methods for managing repository mirrors.
    - name: OperationService
      description: Manages long-running operations.
    - name: PublicationService
      description: Manages the publication of Debian artifacts.
    - name: PublicationTargetService
      description: Manages the storage destinations for publishing Debian archives.
